<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VIRUS HUNTER v12.0</title>
    <!-- Подключаем библиотеку для работы с ZIP архивами -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <style>
        body {
            background-color: #000;
            color: #00ff00;
            font-family: 'Consolas', 'Courier New', monospace;
            margin: 0;
            padding: 0;
            height: 100vh;
            overflow: hidden;
        }

        /* --- 1. ЭКРАН ВХОДА --- */
        #auth-screen {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100%;
            background: #050505;
        }
        .auth-box {
            border: 1px solid #00ff00;
            padding: 30px;
            width: 300px;
            text-align: center;
            box-shadow: 0 0 15px rgba(0, 255, 0, 0.1);
        }
        .auth-input {
            width: 100%; padding: 10px; margin-bottom: 10px; background: #000; 
            border: 1px solid #333; color: #00ff00; box-sizing: border-box; font-family: inherit;
        }
        .auth-btn {
            width: 100%; padding: 10px; background: #004400; color: #fff; 
            border: none; cursor: pointer; font-weight: bold; margin-bottom: 5px; font-family: inherit;
        }
        .auth-btn:hover { background: #00ff00; color: #000; }

        /* --- 2. ГЛАВНЫЙ ЭКРАН --- */
        #app-screen {
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100%;
            position: relative;
        }

        h1 {
            margin-bottom: 30px;
            font-size: 24px;
            letter-spacing: 2px;
            text-transform: uppercase;
            text-shadow: 0 0 10px #00ff00;
        }

        /* Панель управления */
        .control-bar {
            display: flex;
            background: #111;
            border: 1px solid #333;
            padding: 10px;
            border-radius: 3px;
            gap: 5px;
            width: 1000px; /* Расширили для новых кнопок */
            max-width: 95%;
            box-sizing: border-box;
        }

        select, input[type="file"], button {
            background: #222;
            color: #e0e0e0;
            border: 1px solid #444;
            padding: 8px 12px;
            font-family: inherit;
            font-size: 14px;
            height: 40px;
            box-sizing: border-box;
        }

        #targetType { width: 180px; }
        #fileInput { flex-grow: 1; color: #aaa; }
        #scanMode { width: 160px; }
        
        #btnScan {
            background: #006400;
            color: #fff;
            border: none;
            font-weight: bold;
            width: 120px;
            cursor: pointer;
            transition: 0.2s;
        }
        #btnScan:hover { background: #00ff00; color: #000; }
        #btnScan:disabled { background: #333; color: #555; cursor: not-allowed; }

        .status-bar {
            width: 1000px;
            max-width: 95%;
            margin-top: 10px;
            margin-bottom: 5px;
            display: flex;
            justify-content: space-between;
            font-size: 12px;
            color: #666;
        }
        .user-badge { color: gold; }

        /* Терминал */
        .terminal {
            width: 1000px;
            max-width: 95%;
            height: 450px;
            border: 1px solid #00ff00;
            background: #000;
            padding: 15px;
            overflow-y: auto;
            font-size: 14px;
            box-sizing: border-box;
            box-shadow: 0 0 10px rgba(0, 255, 0, 0.05);
        }

        .log-line { margin-bottom: 4px; word-break: break-all; }
        .danger { color: #ff3333; }
        .warn { color: #ffa500; } /* Оранжевый для предупреждений */
        .sys { color: #555; }
        .info { color: #00ffff; }
        .decrypt { color: #d600ff; }
        .zip-entry { color: #ffff00; border-top: 1px dashed #333; margin-top: 5px; padding-top: 2px; }

        /* --- ВЕРДИКТ --- */
        .verdict-modal {
            display: none; position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%);
            background: rgba(0,0,0,0.95); border: 2px solid #fff; padding: 30px; text-align: center; z-index: 100;
            box-shadow: 0 0 30px rgba(255,255,255,0.2);
            width: 400px;
        }
        .v-title-text { color:#888; font-size:16px; }
        .v-score { font-size: 40px; font-weight: bold; margin: 10px 0; }
        .v-desc { margin-bottom: 15px; font-size: 14px; }
        
        .v-details-box {
            background: #111;
            border: 1px solid #333;
            padding: 10px;
            margin-bottom: 20px;
            max-height: 200px;
            overflow-y: auto;
            text-align: left;
            font-size: 12px;
            display: none;
        }
        .v-details-list { list-style: none; padding: 0; margin: 0; }
        .v-details-list li { color: #ff5555; margin-bottom: 4px; border-bottom: 1px solid #222; padding-bottom: 2px;}
        .v-details-list li.warn-item { color: #ffa500; }

        .btn-close { background: transparent; border: 1px solid #fff; color: #fff; padding: 8px 25px; cursor: pointer; font-family: inherit; }
        .btn-close:hover { background: #fff; color: #000; }

        /* --- MENU & FEED --- */
        .top-menu { position: absolute; top: 20px; right: 20px; font-size: 12px; }
        .menu-btn { background: none; border: 1px solid #333; color: #666; padding: 4px 8px; cursor: pointer; margin-left: 5px; }
        .menu-btn:hover { border-color: #00ff00; color: #00ff00; }
        
        .feed-panel {
            position: fixed; top: 0; right: 0; bottom: 0; width: 300px;
            background: #111; border-left: 1px solid #00ff00;
            z-index: 50; display: none; flex-direction: column; padding: 10px;
        }
        .feed-panel.open { display: flex; }
        .feed-item { background: #1a1a1a; padding: 5px; margin-bottom: 5px; border-left: 2px solid #555; font-size: 12px; color: #ccc; }
        .feed-item.infected { border-color: red; }
        .feed-item.warning { border-color: orange; }

    </style>
</head>
<body>

    <!-- ВХОД -->
    <div id="auth-screen">
        <div class="auth-box">
            <h2 style="margin:0 0 20px 0; color:#00ff00;">SYSTEM LOGIN</h2>
            <input type="email" id="email" class="auth-input" placeholder="Email">
            <input type="password" id="password" class="auth-input" placeholder="Password">
            <button class="auth-btn" id="btnLogin">CONNECT</button>
            <button class="auth-btn" style="background:#222;" id="btnRegister">REGISTER</button>
            <div id="auth-error" style="color:red; margin-top:10px; display:none;">Error</div>
        </div>
    </div>

    <!-- ПРИЛОЖЕНИЕ -->
    <div id="app-screen">
        <div class="top-menu">
            <span id="user-display" style="color:#444; margin-right:10px;">...</span>
            <button class="menu-btn" onclick="toggleFeed()">FEED</button>
            <button class="menu-btn" onclick="doLogout()">EXIT</button>
        </div>

        <h1>🧬 VIRUS HUNTER v12.0</h1>

        <div class="control-bar">
            <select id="targetType" title="Target Type">
                <option value="bat">Batch (.bat)</option>
                <option value="py">Python (.py)</option>
                <option value="exe">Binary (.exe)</option>
                <option value="jar">Java (.jar)</option>
                <option value="vbs">VBScript (.vbs)</option>
                <option value="ps1">PowerShell (.ps1)</option>
                <option value="web">Web (.html/.js)</option>
                <option value="zip">Archive (.zip)</option>
            </select>

            <input type="file" id="fileInput">

            <select id="scanMode" title="Scan Mode">
                <option value="fast">Fast Scan</option>
                <option value="auto" disabled>Auto (Smart) [LOCK]</option>
                <option value="full" disabled>Full (Deep) [LOCK]</option>
            </select>

            <button id="btnScan" disabled onclick="startScanLogic()">ЗАПУСК</button>
        </div>

        <div class="status-bar">
            <span id="status-text">System ready. Select file.</span>
            <span id="sub-badge" style="color:#888;">SUBSCRIPTION: LOADING...</span>
        </div>

        <div class="terminal" id="terminal">
            <div class="sys">> Initializing all modules (ZIP/PE/WEB)... OK</div>
            <div class="sys">> Connected to Firebase Cloud... OK</div>
        </div>

        <div class="feed-panel" id="feedPanel">
            <div style="color:orange; margin-bottom:10px; font-weight:bold;">GLOBAL THREATS</div>
            <div id="feed" style="overflow-y:auto; flex:1;">Loading...</div>
            <button onclick="toggleFeed()" style="margin-top:10px; background:#333; color:#fff; border:none; padding:5px; cursor:pointer;">CLOSE</button>
        </div>
    </div>

    <!-- ВЕРДИКТ -->
    <div id="verdict" class="verdict-modal">
        <div class="v-title-text">SCAN RESULT</div>
        <div id="v-score" class="v-score">CLEAN</div>
        <div id="v-desc">No threats detected.</div>
        
        <div id="v-details" class="v-details-box">
            <div style="color:#888; margin-bottom:5px; border-bottom:1px solid #333;">THREAT REPORT:</div>
            <ul id="v-list" class="v-details-list"></ul>
        </div>

        <button class="btn-close" onclick="document.getElementById('verdict').style.display='none'">CLOSE</button>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/9.22.0/firebase-app.js";
        import { getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/9.22.0/firebase-auth.js";
        import { getDatabase, ref, set, push, onValue } from "https://www.gstatic.com/firebasejs/9.22.0/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDYQgJa7rlB_CAB4ywufavumzZrsS_pqNc",
            authDomain: "antivirus-1f569.firebaseapp.com",
            databaseURL: "https://antivirus-1f569-default-rtdb.firebaseio.com",
            projectId: "antivirus-1f569",
            storageBucket: "antivirus-1f569.firebasestorage.app",
            messagingSenderId: "780704862578",
            appId: "1:780704862578:web:a3f4eafe292a00ace8cdeb"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getDatabase(app);

        let fileRawData = null;
        let fileName = "";

        window.toggleFeed = () => document.getElementById('feedPanel').classList.toggle('open');
        window.doLogout = () => signOut(auth);

        onAuthStateChanged(auth, (user) => {
            if(user) {
                document.getElementById('auth-screen').style.display = 'none';
                document.getElementById('app-screen').style.display = 'flex';
                document.getElementById('user-display').innerText = user.email;
                loadUser(user.uid);
                listenFeed();
            } else {
                document.getElementById('auth-screen').style.display = 'flex';
                document.getElementById('app-screen').style.display = 'none';
            }
        });

        function loadUser(uid) {
            onValue(ref(db, 'Users/'+uid), (s) => {
                const d = s.val();
                const sub = (d && d.Subscribe) ? d.Subscribe : 'default';
                document.getElementById('sub-badge').innerText = `SUBSCRIPTION: ${sub.toUpperCase()}`;
                
                const oA = document.querySelector('option[value="auto"]');
                const oF = document.querySelector('option[value="full"]');
                
                oA.disabled=true; oA.innerText="Auto [LOCK]";
                oF.disabled=true; oF.innerText="Full [LOCK]";
                
                if(sub === 'Auto' || sub === 'Full') { oA.disabled=false; oA.innerText="Auto (Smart)"; }
                if(sub === 'Full') { oF.disabled=false; oF.innerText="Full (Deep + Decrypt)"; }
            });
        }

        document.getElementById('btnLogin').onclick = () => {
            signInWithEmailAndPassword(auth, document.getElementById('email').value, document.getElementById('password').value)
            .catch(e => { document.getElementById('auth-error').innerText = "Login Failed"; document.getElementById('auth-error').style.display='block'; });
        };
        document.getElementById('btnRegister').onclick = () => {
            const e = document.getElementById('email').value, p = document.getElementById('password').value;
            if(p.length<6) return alert("Password min 6 chars");
            createUserWithEmailAndPassword(auth, e, p)
            .then(c => set(ref(db, 'Users/'+c.user.uid), {email:e, Subscribe:"default"}))
            .catch(e => alert(e.message));
        };

        // --- БАЗЫ СИГНАТУР ---
        
        const batRules = [
            { regex: /format\s/i, msg: "FORMAT DISK", score: 10 },
            { regex: /del\s|erase\s/i, msg: "DELETE FILE", score: 2 },
            { regex: /start\s/i, msg: "START PROCESS", score: 1 },
            { regex: /%0/i, msg: "FORK BOMB", score: 10 },
            { regex: /reg add|reg delete/i, msg: "REGISTRY EDIT", score: 8 }
        ];
        
        const pyRules = [
            { regex: /os\.remove|shutil\.rmtree/i, msg: "PY: DELETE FILE", score: 3 },
            { regex: /ctypes\.windll|BlockInput/i, msg: "PY: BLOCK INPUT", score: 10 },
            { regex: /pynput|keyboard\.hook/i, msg: "PY: KEYLOGGER", score: 5 },
            { regex: /socket|requests\.post/i, msg: "PY: STEAL DATA", score: 2 }
        ];

        const exeRules = [
            { regex: /ShellExecute/i, msg: "API: EXECUTE COMMAND", score: 3 },
            { regex: /InternetOpen|URLDownloadToFile/i, msg: "API: DOWNLOADER", score: 5 },
            { regex: /RegSetValueEx/i, msg: "API: REGISTRY WRITE", score: 4 },
            { regex: /GetAsyncKeyState|SetWindowsHookEx/i, msg: "API: KEYLOGGER HOOK", score: 8 },
            { regex: /cmd\.exe|powershell\.exe/i, msg: "STR: SHELL CALL", score: 5 }
        ];

        const jarRules = [
            { regex: /java\/lang\/Runtime|getRuntime/i, msg: "JAVA: RUNTIME EXEC", score: 5 },
            { regex: /java\/net\/URLClassLoader/i, msg: "JAVA: REMOTE LOADER", score: 6 },
            { regex: /org\/bukkit|force-op/i, msg: "MC: MALICIOUS PLUGIN", score: 8 }
        ];

        // ИСПРАВЛЕННЫЙ VBS (Снизили баллы)
        const vbsRules = [
            { regex: /CreateObject\("WScript\.Shell"\)/i, msg: "VBS: SHELL OBJECT", score: 2 }, // Было 3, стало 2 (Warning)
            { regex: /FileSystemObject/i, msg: "VBS: FILE SYSTEM", score: 2 },
            { regex: /AutoOpen/i, msg: "VBS: MACRO VIRUS", score: 5 },
            { regex: /powershell/i, msg: "VBS: POWERSHELL CALL", score: 4 }
        ];

        // НОВЫЕ ПРАВИЛА
        const ps1Rules = [
            { regex: /Invoke-Expression|IEX/i, msg: "PS1: EXECUTE (IEX)", score: 5 },
            { regex: /Net\.WebClient|DownloadString/i, msg: "PS1: DOWNLOADER", score: 5 },
            { regex: /-WindowStyle\s+Hidden/i, msg: "PS1: HIDDEN WINDOW", score: 4 },
            { regex: /Bypass/i, msg: "PS1: BYPASS POLICY", score: 3 }
        ];

        const webRules = [
            { regex: /<script|javascript:/i, msg: "WEB: INLINE SCRIPT", score: 1 },
            { regex: /eval\(|document\.cookie/i, msg: "JS: DANGEROUS FUNC", score: 2 },
            { regex: /window\.location\.replace/i, msg: "JS: REDIRECT", score: 2 },
            { regex: /iframe.*display:\s*none/i, msg: "HTML: HIDDEN IFRAME", score: 4 }
        ];


        document.getElementById('fileInput').onchange = (e) => {
            const f = e.target.files[0];
            if(f) {
                fileName = f.name;
                fileRawData = f; 
                document.getElementById('btnScan').disabled = false;
                log(`File Selected: ${fileName} (${(f.size/1024).toFixed(1)} KB)`);
                
                // Авто-определение
                const ext = fileName.split('.').pop().toLowerCase();
                const sel = document.getElementById('targetType');
                if(['bat','cmd'].includes(ext)) sel.value='bat';
                if(['py','pyw'].includes(ext)) sel.value='py';
                if(['exe','dll'].includes(ext)) sel.value='exe';
                if(['jar'].includes(ext)) sel.value='jar';
                if(['vbs'].includes(ext)) sel.value='vbs';
                if(['ps1'].includes(ext)) sel.value='ps1';
                if(['html','htm','js'].includes(ext)) sel.value='web';
                if(['zip','rar'].includes(ext)) sel.value='zip';
            }
        };

        function log(t, c="") {
            const term = document.getElementById('terminal');
            term.innerHTML += `<div class="log-line ${c}">> ${t}</div>`;
            term.scrollTop = term.scrollHeight;
        }

        window.startScanLogic = async () => {
            const mode = document.getElementById('scanMode').value;
            const type = document.getElementById('targetType').value;
            
            document.getElementById('btnScan').disabled = true;
            document.getElementById('terminal').innerHTML = "";
            document.getElementById('verdict').style.display = "none";
            
            log(`SCAN STARTED. MODE: ${mode.toUpperCase()} | TARGET: ${type.toUpperCase()}`);

            let uniqueThreats = new Set();
            let totalScore = 0;

            // ЛОГИКА ДЛЯ ZIP (Архивы)
            if(type === 'zip') {
                log("Reading ZIP archive...", "sys");
                try {
                    const zip = new JSZip();
                    const content = await zip.loadAsync(fileRawData);
                    let fileCount = 0;

                    // Перебираем файлы внутри ZIP
                    for (const [relativePath, zipEntry] of Object.entries(content.files)) {
                        if(zipEntry.dir) continue;
                        fileCount++;
                        log(`Extracting: ${relativePath}`, "zip-entry");
                        
                        // Читаем файл как текст
                        const text = await zipEntry.async("string");
                        
                        // Определяем правила по расширению файла внутри архива
                        let innerRules = [];
                        if(relativePath.endsWith('.bat')) innerRules = batRules;
                        else if(relativePath.endsWith('.py')) innerRules = pyRules;
                        else if(relativePath.endsWith('.vbs')) innerRules = vbsRules;
                        else if(relativePath.endsWith('.ps1')) innerRules = ps1Rules;
                        else if(relativePath.endsWith('.js') || relativePath.endsWith('.html')) innerRules = webRules;
                        
                        // Сканируем содержимое файла
                        if(innerRules.length > 0) {
                             const lines = text.split('\n');
                             lines.forEach(line => {
                                 if(line.trim().length > 3) {
                                     for(const r of innerRules) {
                                         if(r.regex.test(line)) {
                                             totalScore += r.score;
                                             uniqueThreats.add(`${r.msg} in ${relativePath}`);
                                             log(`DETECTED: ${r.msg}`, "danger");
                                         }
                                     }
                                 }
                             });
                        }
                    }
                    log(`ZIP Scan Complete. Scanned ${fileCount} files.`);
                    finish(totalScore, mode, uniqueThreats);

                } catch(e) {
                    log("Error reading ZIP: " + e, "danger");
                    document.getElementById('btnScan').disabled = false;
                }
                return; // Выход, так как ZIP обработан отдельно
            }

            // ЛОГИКА ДЛЯ ОБЫЧНЫХ ФАЙЛОВ
            let rules = batRules;
            if(type === 'py') rules = pyRules;
            if(type === 'exe') rules = exeRules;
            if(type === 'jar') rules = jarRules;
            if(type === 'vbs') rules = vbsRules;
            if(type === 'ps1') rules = ps1Rules;
            if(type === 'web') rules = webRules;

            const reader = new FileReader();
            reader.onload = (ev) => {
                const text = ev.target.result;
                const lines = text.split('\n');
                
                let delay = mode==='full'?10:2;
                let idx = 0;

                function step() {
                    if(idx >= lines.length) { finish(totalScore, mode, uniqueThreats); return; }
                    let line = lines[idx].trim();

                    if(line.length > 3 && !line.startsWith('rem') && !line.startsWith('#')) {
                        for(const r of rules) {
                            if(r.regex.test(line)) {
                                totalScore += r.score;
                                uniqueThreats.add(r.msg);
                                log(`DETECTED: ${r.msg}`, "danger");
                                break; // Одна угроза на строку
                            }
                        }
                    }
                    idx++;
                    if(idx % 10 === 0) setTimeout(step, delay); else step();
                }
                step();
            };

            // Бинарники (exe/jar) читаем как ISO, текст как текст
            if(type === 'exe' || type === 'jar') reader.readAsText(fileRawData, 'ISO-8859-1');
            else reader.readAsText(fileRawData, 'CP866');
        };

        function finish(score, mode, threats) {
            document.getElementById('btnScan').disabled = false;
            
            let status = "CLEAN";
            let color = "lime";

            // НОВАЯ ЛОГИКА ВЕРДИКТА (3 Уровня)
            if(score >= 5) {
                status = "INFECTED";
                color = "red";
            } else if (score > 0) {
                status = "WARNING"; // Желтый уровень для подозрительных VBS
                color = "orange";
            }

            log(`RESULT: ${status}`, score >= 5 ? "danger" : (score > 0 ? "warn" : "safe"));
            
            const v = document.getElementById('verdict');
            const vs = document.getElementById('v-score');
            const vd = document.getElementById('v-desc');
            const vDetails = document.getElementById('v-details');
            const vList = document.getElementById('v-list');
            
            v.style.display = "block";
            v.style.borderColor = color;
            vList.innerHTML = "";

            vs.innerText = status;
            vs.style.color = color;

            if(score === 0) {
                vd.innerText = "No threats detected.";
                vDetails.style.display = "none";
            } else {
                vd.innerText = `Threat Score: ${score}`;
                vd.style.color = color;
                vDetails.style.display = "block";
                
                threats.forEach(msg => {
                    let li = document.createElement("li");
                    li.innerText = "• " + msg;
                    if(score < 5) li.className = "warn-item"; // Оранжевый текст в списке
                    vList.appendChild(li);
                });
            }

            push(ref(db, 'scans'), {
                filename: fileName, score: score, status: status, mode: mode,
                user: document.getElementById('user-display').innerText, timestamp: Date.now()
            });
        }

        function listenFeed() {
            onValue(ref(db, 'scans'), (s) => {
                const f = document.getElementById('feed');
                f.innerHTML = "";
                const d = s.val();
                if(!d) return;
                Object.values(d).reverse().slice(0,15).forEach(i => {
                    let c = "clean";
                    if(i.score >= 5) c = "infected";
                    else if(i.score > 0) c = "warning"; // Поддержка желтого в фиде
                    
                    f.innerHTML += `<div class="feed-item ${c}"><b>${i.filename}</b><br>${i.status} (${i.user?i.user.split('@')[0]:'?'})</div>`;
                });
            });
        }
    </script>
</body>
</html>
