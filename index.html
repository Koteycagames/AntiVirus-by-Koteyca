<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VIRUS HUNTER v13.2 (RU)</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <style>
        body {
            background-color: #000;
            color: #00ff00;
            font-family: 'Consolas', 'Courier New', monospace;
            margin: 0;
            padding: 0;
            height: 100vh;
            overflow: hidden;
        }

        /* --- 1. ЭКРАН ВХОДА --- */
        #auth-screen { display: flex; justify-content: center; align-items: center; height: 100%; background: #050505; }
        .auth-box { border: 1px solid #00ff00; padding: 30px; width: 300px; text-align: center; box-shadow: 0 0 15px rgba(0, 255, 0, 0.1); }
        .auth-input { width: 100%; padding: 10px; margin-bottom: 10px; background: #000; border: 1px solid #333; color: #00ff00; box-sizing: border-box; font-family: inherit; }
        .auth-btn { width: 100%; padding: 10px; background: #004400; color: #fff; border: none; cursor: pointer; font-weight: bold; margin-bottom: 5px; font-family: inherit; }
        .auth-btn:hover { background: #00ff00; color: #000; }

        /* --- 2. ГЛАВНЫЙ ЭКРАН --- */
        #app-screen { display: none; flex-direction: column; align-items: center; justify-content: center; height: 100%; position: relative; }
        h1 { margin-bottom: 30px; font-size: 24px; letter-spacing: 2px; text-transform: uppercase; text-shadow: 0 0 10px #00ff00; }

        .control-bar { display: flex; background: #111; border: 1px solid #333; padding: 10px; border-radius: 3px; gap: 5px; width: 1000px; max-width: 95%; box-sizing: border-box; }
        select, input[type="file"], button { background: #222; color: #e0e0e0; border: 1px solid #444; padding: 8px 12px; font-family: inherit; font-size: 14px; height: 40px; box-sizing: border-box; }
        #targetType { width: 180px; }
        #fileInput { flex-grow: 1; color: #aaa; }
        #scanMode { width: 200px; }
        #btnScan { background: #006400; color: #fff; border: none; font-weight: bold; width: 120px; cursor: pointer; transition: 0.2s; }
        #btnScan:hover { background: #00ff00; color: #000; }
        #btnScan:disabled { background: #333; color: #555; cursor: not-allowed; }

        .status-bar { width: 1000px; max-width: 95%; margin-top: 10px; margin-bottom: 5px; display: flex; justify-content: space-between; font-size: 12px; color: #666; }
        .terminal { width: 1000px; max-width: 95%; height: 450px; border: 1px solid #00ff00; background: #000; padding: 15px; overflow-y: auto; font-size: 14px; box-sizing: border-box; box-shadow: 0 0 10px rgba(0, 255, 0, 0.05); }
        .log-line { margin-bottom: 4px; word-break: break-all; }
        
        .level-1 { color: #ffff00; } /* Подозрительно */
        .level-2 { color: #ff8800; } /* Опасно */
        .level-3 { color: #ff0000; font-weight: bold; } /* Критично */
        .sys { color: #555; }
        .info { color: #00ffff; }
        .decrypt { color: #d600ff; }
        .zip-entry { color: #ffff00; border-top: 1px dashed #333; margin-top: 5px; padding-top: 2px; }

        /* --- VERDICT MODAL --- */
        .verdict-modal { display: none; position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); background: rgba(0,0,0,0.95); border: 2px solid #fff; padding: 30px; text-align: center; z-index: 100; box-shadow: 0 0 30px rgba(255,255,255,0.2); width: 450px; }
        .v-title-text { color:#888; font-size:16px; }
        .v-score { font-size: 36px; font-weight: bold; margin: 10px 0; text-transform: uppercase; }
        .v-desc { margin-bottom: 15px; font-size: 14px; color: #ccc; }
        
        .v-details-box { background: #111; border: 1px solid #333; padding: 10px; margin-bottom: 20px; max-height: 200px; overflow-y: auto; text-align: left; font-size: 12px; display: none; }
        .v-details-list { list-style: none; padding: 0; margin: 0; }
        .v-details-list li { margin-bottom: 4px; border-bottom: 1px solid #222; padding-bottom: 2px; }

        .btn-close { background: transparent; border: 1px solid #fff; color: #fff; padding: 8px 25px; cursor: pointer; font-family: inherit; }
        .btn-close:hover { background: #fff; color: #000; }

        /* --- MENU & FEED --- */
        .top-menu { position: absolute; top: 20px; right: 20px; font-size: 12px; }
        .menu-btn { background: none; border: 1px solid #333; color: #666; padding: 4px 8px; cursor: pointer; margin-left: 5px; }
        .menu-btn:hover { border-color: #00ff00; color: #00ff00; }
        
        .feed-panel { position: fixed; top: 0; right: 0; bottom: 0; width: 300px; background: #111; border-left: 1px solid #00ff00; z-index: 50; display: none; flex-direction: column; padding: 10px; }
        .feed-panel.open { display: flex; }
        .feed-item { background: #1a1a1a; padding: 5px; margin-bottom: 5px; border-left: 4px solid #555; font-size: 12px; color: #ccc; }
        .feed-item.clean { border-color: lime; }
        .feed-item.suspicious { border-color: yellow; }
        .feed-item.dangerous { border-color: orange; }
        .feed-item.critical { border-color: red; }

    </style>
</head>
<body>

    <!-- ВХОД -->

    <!-- ПРИЛОЖЕНИЕ -->

            <span id="user-display" style="color:#444; margin-right:10px;">...</span>
            <button class="menu-btn" onclick="toggleFeed()">ЛЕНТА</button>
            <button class="menu-btn" onclick="doLogout()">ВЫХОД</button>
        </div>

        <h1>🧬 VIRUS HUNTER v13.2</h1>

        <div class="control-bar">
            <select id="targetType" title="Тип файла">
                <option value="bat">Batch (.bat)</option>
                <option value="py">Python (.py)</option>
                <option value="exe">Binary (.exe)</option>
                <option value="jar">Java (.jar)</option>
                <option value="vbs">VBScript (.vbs)</option>
                <option value="ps1">PowerShell (.ps1)</option>
                <option value="web">Web (.html/.js)</option>
                <option value="zip">Archive (.zip)</option>
            </select>
            <input type="file" id="fileInput">
            <select id="scanMode" title="Режим сканирования">
                <option value="fast">Быстрое</option>
                <option value="auto" disabled>Авто (Умное) [ЗАКРЫТО]</option>
                <option value="full" disabled>Полное (Глубокое) [ЗАКРЫТО]</option>
            </select>
            <button id="btnScan" disabled onclick="startScanLogic()">ЗАПУСК</button>
        </div>

        <div class="status-bar">
            <span id="status-text">Система готова. Выберите файл.</span>
            <span id="sub-badge" style="color:#888;">ПОДПИСКА: ЗАГРУЗКА...</span>
        </div>

        <div class="terminal" id="terminal">
            <div class="sys">> Инициализация логического движка v13.2... ОК</div>
            <div class="sys">> Подключение к базе данных... ОК</div>
        </div>

        <div class="feed-panel" id="feedPanel">
            <div style="color:orange; margin-bottom:10px; font-weight:bold;">ГЛОБАЛЬНЫЕ УГРОЗЫ</div>
            <div id="feed" style="overflow-y:auto; flex:1;">Загрузка...</div>
            <button onclick="toggleFeed()" style="margin-top:10px; background:#333; color:#fff; border:none; padding:5px; cursor:pointer;">ЗАКРЫТЬ</button>
        </div>
    </div>

    <!-- ВЕРДИКТ -->
    <div id="verdict" class="verdict-modal">
        <div class="v-title-text">ОТЧЕТ ОБ АНАЛИЗЕ</div>
        <div id="v-score" class="v-score">ЧИСТО</div>
        <div id="v-desc">Вредоносных шаблонов не обнаружено.</div>
        <div id="v-details" class="v-details-box">
            <div style="color:#888; margin-bottom:5px; border-bottom:1px solid #333;">НАЙДЕННЫЕ ОБЪЕКТЫ:</div>
            <ul id="v-list" class="v-details-list"></ul>
        </div>
        <button class="btn-close" onclick="document.getElementById('verdict').style.display='none'">ЗАКРЫТЬ</button>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/9.22.0/firebase-app.js";
        import { getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/9.22.0/firebase-auth.js";
        import { getDatabase, ref, set, push, onValue } from "https://www.gstatic.com/firebasejs/9.22.0/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDYQgJa7rlB_CAB4ywufavumzZrsS_pqNc",
            authDomain: "antivirus-1f569.firebaseapp.com",
            databaseURL: "https://antivirus-1f569-default-rtdb.firebaseio.com",
            projectId: "antivirus-1f569",
            storageBucket: "antivirus-1f569.firebasestorage.app",
            messagingSenderId: "780704862578",
            appId: "1:780704862578:web:a3f4eafe292a00ace8cdeb"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getDatabase(app);

        let fileRawData = null;
        let fileName = "";
        let fileLines = [];

        window.toggleFeed = () => document.getElementById('feedPanel').classList.toggle('open');
        window.doLogout = () => signOut(auth);

        // AUTH LOGIC
        onAuthStateChanged(auth, (user) => {
            if(user) {
                document.getElementById('auth-screen').style.display = 'none';
                document.getElementById('app-screen').style.display = 'flex';
                document.getElementById('user-display').innerText = user.email;
                loadUser(user.uid);
                listenFeed();
            } else {
                document.getElementById('auth-screen').style.display = 'flex';
                document.getElementById('app-screen').style.display = 'none';
            }
        });

        function loadUser(uid) {
            onValue(ref(db, 'Users/'+uid), (s) => {
                const d = s.val();
                const sub = (d && d.Subscribe) ? d.Subscribe : 'default';
                document.getElementById('sub-badge').innerText = `ПОДПИСКА: ${sub.toUpperCase()}`;
                const oA = document.querySelector('option[value="auto"]');
                const oF = document.querySelector('option[value="full"]');
                oA.disabled=true; oA.innerText="Авто [ЗАКРЫТО]";
                oF.disabled=true; oF.innerText="Полное [ЗАКРЫТО]";
                if(sub === 'Auto' || sub === 'Full') { oA.disabled=false; oA.innerText="Авто (Умное)"; }
                if(sub === 'Full') { oF.disabled=false; oF.innerText="Полное (Глубокое)"; }
            });
        }

        document.getElementById('btnLogin').onclick = () => {
            signInWithEmailAndPassword(auth, document.getElementById('email').value, document.getElementById('password').value)
            .catch(e => { document.getElementById('auth-error').innerText = "Ошибка входа"; document.getElementById('auth-error').style.display='block'; });
        };
        document.getElementById('btnRegister').onclick = () => {
            const e = document.getElementById('email').value, p = document.getElementById('password').value;
            if(p.length<6) return alert("Пароль мин. 6 символов");
            createUserWithEmailAndPassword(auth, e, p)
            .then(c => set(ref(db, 'Users/'+c.user.uid), {email:e, Subscribe:"default"}))
            .catch(e => alert(e.message));
        };

        // --- ПРАВИЛА (ПЕРЕВЕДЕНЫ НА РУССКИЙ) ---

        const batRules = [
            { regex: /del\s|erase\s/i, msg: "УДАЛЕНИЕ ФАЙЛА", level: 1 },
            { regex: /ren\s|rename\s/i, msg: "ПЕРЕИМЕНОВАНИЕ", level: 1 },
            { regex: /move\s/i, msg: "ПЕРЕМЕЩЕНИЕ ФАЙЛА", level: 1 },
            { regex: /shutdown/i, msg: "ВЫКЛЮЧЕНИЕ/ПЕРЕЗАГРУЗКА", level: 1 },
            { regex: /copy\s|xcopy\s/i, msg: "КОПИРОВАНИЕ ФАЙЛА", level: 2 },
            { regex: /attrib\s/i, msg: "СКРЫТИЕ ФАЙЛОВ", level: 2 },
            { regex: /%0/i, msg: "FORK-БОМБА / ЦИКЛ", level: 2 },
            { regex: /CurrentVersion\\Run/i, msg: "АВТОЗАГРУЗКА (РЕЕСТР)", level: 2 },
            { regex: /format\s/i, msg: "ФОРМАТИРОВАНИЕ ДИСКА", level: 3 },
            { regex: /reg\s+add|reg\s+delete/i, msg: "ИЗМЕНЕНИЕ РЕЕСТРА", level: 3 },
            { regex: /rd\s|rmdir\s/i, msg: "УДАЛЕНИЕ ПАПКИ", level: 2 }
        ];
        
        const pyRules = [
            { regex: /os\.remove|shutil\.rmtree/i, msg: "PY: УДАЛЕНИЕ ФАЙЛА", level: 1 },
            { regex: /os\.rename/i, msg: "PY: ПЕРЕИМЕНОВАНИЕ", level: 1 },
            { regex: /shutil\.copy/i, msg: "PY: КОПИРОВАНИЕ", level: 2 },
            { regex: /w\.attributes\("-fullscreen",\s*True\)/i, msg: "ВИНЛОКЕР: ПОЛНЫЙ ЭКРАН", level: 2 },
            { regex: /ctypes\.windll|BlockInput/i, msg: "ВИНЛОКЕР: БЛОК ВВОДА", level: 3 },
            { regex: /pynput|keyboard\.hook/i, msg: "ШПИОН: КЕЙЛОГГЕР", level: 3 },
            { regex: /winreg/i, msg: "PY: ВЗЛОМ РЕЕСТРА", level: 3 }
        ];

        const exeRules = [
            { regex: /ShellExecute/i, msg: "API: ВЫПОЛНЕНИЕ КОМАНДЫ", level: 1 },
            { regex: /IsDebuggerPresent/i, msg: "АНТИ-ОТЛАДКА", level: 1 },
            { regex: /InternetOpen|URLDownloadToFile/i, msg: "API: ЗАГРУЗЧИК", level: 2 },
            { regex: /cmd\.exe|powershell\.exe/i, msg: "STR: ВЫЗОВ КОНСОЛИ", level: 2 },
            { regex: /RegSetValueEx/i, msg: "API: ЗАПИСЬ В РЕЕСТР", level: 3 },
            { regex: /GetAsyncKeyState|SetWindowsHookEx/i, msg: "API: КЕЙЛОГГЕР (HOOK)", level: 3 }
        ];

        const vbsRules = [
            { regex: /CreateObject\("WScript\.Shell"\)/i, msg: "VBS: ОБЪЕКТ SHELL", level: 1 },
            { regex: /FileSystemObject/i, msg: "VBS: ФАЙЛОВАЯ СИСТЕМА", level: 1 },
            { regex: /AutoOpen|Document_Open/i, msg: "VBS: МАКРО ВИРУС", level: 2 }
        ];

        const ps1Rules = [
            { regex: /Invoke-Expression|IEX/i, msg: "PS1: ЗАПУСК КОДА (IEX)", level: 3 },
            { regex: /Net\.WebClient|DownloadString/i, msg: "PS1: ЗАГРУЗЧИК", level: 2 },
            { regex: /-WindowStyle\s+Hidden/i, msg: "PS1: СКРЫТОЕ ОКНО", level: 2 },
            { regex: /Bypass/i, msg: "PS1: ОБХОД ПОЛИТИК", level: 1 }
        ];

        const webRules = [
            { regex: /<script|javascript:/i, msg: "WEB: СКРИПТ В СТРОКЕ", level: 1 },
            { regex: /eval\(|document\.cookie/i, msg: "JS: ОПАСНАЯ ФУНКЦИЯ", level: 2 },
            { regex: /window\.location\.replace/i, msg: "JS: ПЕРЕАДРЕСАЦИЯ", level: 1 },
            { regex: /iframe.*display:\s*none/i, msg: "HTML: СКРЫТЫЙ IFRAME", level: 2 }
        ];

        const jarRules = [
            { regex: /java\/lang\/Runtime|getRuntime/i, msg: "JAVA: ЗАПУСК КОМАНДЫ", score: 5 },
            { regex: /java\/net\/URLClassLoader/i, msg: "JAVA: ЗАГРУЗКА ИЗ СЕТИ", score: 6 },
            { regex: /org\/bukkit|force-op|setOp/i, msg: "MC: ВРЕДОНОСНЫЙ ПЛАГИН", score: 8 },
            { regex: /cmd\.exe|bash|sh/i, msg: "JAVA: КОНСОЛЬ", score: 4 },
            { regex: /http:\/\/|https:\/\//i, msg: "STR: НАЙДЕНА ССЫЛКА", score: 1 }
        ];

        function checkSystemTargets(line) {
            if (line.toLowerCase().includes("windows") || line.toLowerCase().includes("system32")) {
                return true;
            }
            return false;
        }

        document.getElementById('fileInput').onchange = (e) => {
            const f = e.target.files[0];
            if(f) {
                fileName = f.name;
                fileRawData = f;
                const type = document.getElementById('targetType').value;
                const reader = new FileReader();
                reader.onload = (ev) => {
                    fileLines = ev.target.result.split('\n');
                    document.getElementById('btnScan').disabled = false;
                    log(`Файл загружен: ${fileName} (${(f.size/1024).toFixed(1)} КБ)`);
                    document.getElementById('status-text').innerText = `Готово.`;
                };
                if(type==='exe'||type==='jar'||fileName.endsWith('.exe')||fileName.endsWith('.jar')||type==='zip'||fileName.endsWith('.zip')) {
                    document.getElementById('btnScan').disabled = false;
                    log(`Бинарник/Архив загружен: ${fileName}`);
                } else {
                    reader.readAsText(f, 'CP866');
                }
            }
        };

        function log(t, c="") {
            const term = document.getElementById('terminal');
            term.innerHTML += `<div class="log-line ${c}">> ${t}</div>`;
            term.scrollTop = term.scrollHeight;
        }

        window.startScanLogic = async () => {
            const mode = document.getElementById('scanMode').value;
            const type = document.getElementById('targetType').value;
            
            document.getElementById('btnScan').disabled = true;
            document.getElementById('terminal').innerHTML = "";
            document.getElementById('verdict').style.display = "none";
            
            log(`СКАНИРОВАНИЕ НАЧАТО. РЕЖИМ: ${mode.toUpperCase()} | ЦЕЛЬ: ${type.toUpperCase()}`);

            let delay = mode==='full'?10:2;
            let acc = mode==='fast'?0.5:(mode==='auto'?0.8:1.0);
            let maxThreatLevel = 0; 
            let foundThreats = [];

            // ZIP LOGIC
            if(type === 'zip' || fileName.endsWith('.zip')) {
                log("Чтение ZIP архива...", "sys");
                try {
                    const zip = new JSZip();
                    const content = await zip.loadAsync(fileRawData);
                    let fileCount = 0;
                    for (const [relativePath, zipEntry] of Object.entries(content.files)) {
                        if(zipEntry.dir) continue;
                        fileCount++;
                        log(`Сканирование: ${relativePath}`, "zip-entry");
                        const text = await zipEntry.async("string");
                        const lines = text.split('\n');
                        
                        let innerRules = [];
                        if(relativePath.endsWith('.bat')) innerRules = batRules;
                        else if(relativePath.endsWith('.py')) innerRules = pyRules;
                        else if(relativePath.endsWith('.vbs')) innerRules = vbsRules;
                        else if(relativePath.endsWith('.ps1')) innerRules = ps1Rules;
                        else if(relativePath.endsWith('.js') || relativePath.endsWith('.html')) innerRules = webRules;
                        
                        if(innerRules.length > 0) {
                             lines.forEach(line => {
                                 if(line.trim().length > 3) {
                                     for(const r of innerRules) {
                                         if(r.regex.test(line)) {
                                             let lvl = r.level;
                                             if(lvl > maxThreatLevel) maxThreatLevel = lvl;
                                             foundThreats.push({ msg: r.msg + ` (${relativePath})`, level: lvl });
                                             log(`ОБНАРУЖЕНО: ${r.msg}`, `level-${lvl}`);
                                         }
                                     }
                                 }
                             });
                        }
                    }
                    finish(maxThreatLevel, mode, foundThreats);
                } catch(e) { log("Ошибка ZIP: " + e, "danger"); finish(0, mode, []); }
                return;
            }

            // STANDARD SCAN
            let rules = batRules;
            if(type === 'py') rules = pyRules;
            if(type === 'exe') rules = exeRules;
            if(type === 'vbs') rules = vbsRules;
            if(type === 'ps1') rules = ps1Rules;
            if(type === 'web') rules = webRules;
            if(type === 'jar') rules = jarRules;

            if(type === 'exe' || type === 'jar') {
                 const reader = new FileReader();
                 reader.onload = (e) => {
                     const text = e.target.result;
                     for(const r of rules) {
                         if(r.regex.test(text)) {
                             let lvl = r.level || 2; // Default for JAR/EXE if missing
                             if(r.score) { // Adapt older rules if they have 'score' instead of 'level'
                                 if(r.score >= 5) lvl = 3;
                                 else if(r.score >= 3) lvl = 2;
                                 else lvl = 1;
                             }
                             if(lvl > maxThreatLevel) maxThreatLevel = lvl;
                             foundThreats.push({ msg: r.msg, level: lvl });
                             log(`НАЙДЕНА СТРОКА: ${r.msg}`, `level-${lvl}`);
                         }
                     }
                     finish(maxThreatLevel, mode, foundThreats);
                 };
                 reader.readAsText(fileRawData, 'ISO-8859-1');
                 return;
            }

            let idx = 0;
            function step() {
                if(idx >= fileLines.length) { finish(maxThreatLevel, mode, foundThreats); return; }
                let line = fileLines[idx].trim();
                
                if(mode==='full' && (type==='bat'||type==='vbs') && line.includes('^')) {
                    line = line.replaceAll('^', '');
                    if(Math.random()>0.9) log("Дешифровка...", "decrypt");
                }

                if(line.length > 3 && !line.startsWith('rem') && !line.startsWith('#')) {
                    for(const r of rules) {
                        if(r.regex.test(line) && Math.random()<=acc) {
                            let currentLevel = r.level;
                            if (checkSystemTargets(line) && (r.msg.includes("УДАЛЕНИЕ") || r.msg.includes("ФОРМАТИРОВАНИЕ") || r.msg.includes("DELETE") || r.msg.includes("FORMAT"))) {
                                currentLevel = 3; r.msg += " (СИСТЕМНЫЙ ФАЙЛ!)";
                            }
                            if(currentLevel > maxThreatLevel) maxThreatLevel = currentLevel;
                            
                            foundThreats.push({ msg: r.msg, level: currentLevel });
                            log(`ОБНАРУЖЕНО: ${r.msg}`, `level-${currentLevel}`);
                            break; 
                        }
                    }
                }
                idx++;
                setTimeout(step, delay);
            }
            step();
        };

        function finish(maxLevel, mode, threats) {
            document.getElementById('btnScan').disabled = false;
            
            let status = "ЧИСТО";
            let color = "lime";

            if(maxLevel === 1) { status = "ПОДОЗРИТЕЛЬНО"; color = "yellow"; }
            if(maxLevel === 2) { status = "ОПАСНО"; color = "orange"; }
            if(maxLevel === 3) { status = "КРИТИЧНО"; color = "red"; }

            log(`РЕЗУЛЬТАТ: ${status}`, maxLevel > 0 ? `level-${maxLevel}` : "sys");
            
            const v = document.getElementById('verdict');
            const vs = document.getElementById('v-score');
            const vd = document.getElementById('v-desc');
            const vList = document.getElementById('v-list');
            const vBox = document.getElementById('v-details');
            
            v.style.display = "block";
            v.style.borderColor = color;
            vs.innerText = status;
            vs.style.color = color;
            
            vList.innerHTML = "";
            if(maxLevel === 0) {
                vd.innerText = "Система безопасна. Угроз нет.";
                vBox.style.display = "none";
            } else {
                vd.innerText = "Обнаружен вредоносный код.";
                vBox.style.display = "block";
                const unique = [...new Set(threats.map(t => JSON.stringify(t)))].map(s => JSON.parse(s));
                unique.forEach(t => {
                    let li = document.createElement("li");
                    li.innerText = `[L${t.level}] ${t.msg}`;
                    if(t.level === 1) li.style.color = "yellow";
                    if(t.level === 2) li.style.color = "orange";
                    if(t.level === 3) li.style.color = "red";
                    vList.appendChild(li);
                });
            }

            push(ref(db, 'scans'), {
                filename: fileName, score: maxLevel, status: status, mode: mode,
                user: document.getElementById('user-display').innerText, timestamp: Date.now()
            });
        }

        function listenFeed() {
            onValue(ref(db, 'scans'), (s) => {
                const f = document.getElementById('feed');
                f.innerHTML = "";
                const d = s.val();
                if(!d) return;
                Object.values(d).reverse().slice(0,15).forEach(i => {
                    let c = "clean";
                    if(i.score === 1) c = "suspicious";
                    if(i.score === 2) c = "dangerous";
                    if(i.score === 3) c = "critical";
                    
                    // Перевод статусов для ленты
                    let displayStatus = i.status;
                    if (displayStatus === "CLEAN") displayStatus = "ЧИСТО";
                    if (displayStatus === "SUSPICIOUS") displayStatus = "ПОДОЗРИТЕЛЬНО";
                    if (displayStatus === "DANGEROUS") displayStatus = "ОПАСНО";
                    if (displayStatus === "VERY DANGEROUS" || displayStatus === "INFECTED") displayStatus = "КРИТИЧНО";
                    if (displayStatus === "WARNING") displayStatus = "ОПАСНО";

                    f.innerHTML += `<div class="feed-item ${c}"><b>${i.filename}</b><br>${displayStatus}</div>`;
                });
            });
        }
    </script>
</body>
</html>
