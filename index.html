<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VIRUS HUNTER v13.0</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <style>
        body {
            background-color: #000;
            color: #00ff00;
            font-family: 'Consolas', 'Courier New', monospace;
            margin: 0;
            padding: 0;
            height: 100vh;
            overflow: hidden;
        }

        /* --- 1. AUTH SCREEN --- */
        #auth-screen { display: flex; justify-content: center; align-items: center; height: 100%; background: #050505; }
        .auth-box { border: 1px solid #00ff00; padding: 30px; width: 300px; text-align: center; box-shadow: 0 0 15px rgba(0, 255, 0, 0.1); }
        .auth-input { width: 100%; padding: 10px; margin-bottom: 10px; background: #000; border: 1px solid #333; color: #00ff00; box-sizing: border-box; font-family: inherit; }
        .auth-btn { width: 100%; padding: 10px; background: #004400; color: #fff; border: none; cursor: pointer; font-weight: bold; margin-bottom: 5px; font-family: inherit; }
        .auth-btn:hover { background: #00ff00; color: #000; }

        /* --- 2. APP SCREEN --- */
        #app-screen { display: none; flex-direction: column; align-items: center; justify-content: center; height: 100%; position: relative; }
        h1 { margin-bottom: 30px; font-size: 24px; letter-spacing: 2px; text-transform: uppercase; text-shadow: 0 0 10px #00ff00; }

        .control-bar { display: flex; background: #111; border: 1px solid #333; padding: 10px; border-radius: 3px; gap: 5px; width: 1000px; max-width: 95%; box-sizing: border-box; }
        select, input[type="file"], button { background: #222; color: #e0e0e0; border: 1px solid #444; padding: 8px 12px; font-family: inherit; font-size: 14px; height: 40px; box-sizing: border-box; }
        #targetType { width: 180px; }
        #fileInput { flex-grow: 1; color: #aaa; }
        #scanMode { width: 160px; }
        #btnScan { background: #006400; color: #fff; border: none; font-weight: bold; width: 120px; cursor: pointer; transition: 0.2s; }
        #btnScan:hover { background: #00ff00; color: #000; }
        #btnScan:disabled { background: #333; color: #555; cursor: not-allowed; }

        .status-bar { width: 1000px; max-width: 95%; margin-top: 10px; margin-bottom: 5px; display: flex; justify-content: space-between; font-size: 12px; color: #666; }
        .terminal { width: 1000px; max-width: 95%; height: 450px; border: 1px solid #00ff00; background: #000; padding: 15px; overflow-y: auto; font-size: 14px; box-sizing: border-box; box-shadow: 0 0 10px rgba(0, 255, 0, 0.05); }
        .log-line { margin-bottom: 4px; word-break: break-all; }
        
        /* Цвета логов по уровням */
        .level-1 { color: #ffff00; } /* Suspicious (Yellow) */
        .level-2 { color: #ff8800; } /* Dangerous (Orange) */
        .level-3 { color: #ff0000; font-weight: bold; } /* Very Dangerous (Red) */
        .sys { color: #555; }
        .info { color: #00ffff; }
        .decrypt { color: #d600ff; }
        .zip-entry { color: #ffff00; border-top: 1px dashed #333; margin-top: 5px; padding-top: 2px; }

        /* --- VERDICT MODAL --- */
        .verdict-modal { display: none; position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); background: rgba(0,0,0,0.95); border: 2px solid #fff; padding: 30px; text-align: center; z-index: 100; box-shadow: 0 0 30px rgba(255,255,255,0.2); width: 400px; }
        .v-title-text { color:#888; font-size:16px; }
        .v-score { font-size: 36px; font-weight: bold; margin: 10px 0; text-transform: uppercase; }
        .v-desc { margin-bottom: 15px; font-size: 14px; color: #ccc; }
        
        .v-details-box { background: #111; border: 1px solid #333; padding: 10px; margin-bottom: 20px; max-height: 200px; overflow-y: auto; text-align: left; font-size: 12px; display: none; }
        .v-details-list { list-style: none; padding: 0; margin: 0; }
        .v-details-list li { margin-bottom: 4px; border-bottom: 1px solid #222; padding-bottom: 2px; }

        .btn-close { background: transparent; border: 1px solid #fff; color: #fff; padding: 8px 25px; cursor: pointer; font-family: inherit; }
        .btn-close:hover { background: #fff; color: #000; }

        /* --- MENU & FEED --- */
        .top-menu { position: absolute; top: 20px; right: 20px; font-size: 12px; }
        .menu-btn { background: none; border: 1px solid #333; color: #666; padding: 4px 8px; cursor: pointer; margin-left: 5px; }
        .menu-btn:hover { border-color: #00ff00; color: #00ff00; }
        
        .feed-panel { position: fixed; top: 0; right: 0; bottom: 0; width: 300px; background: #111; border-left: 1px solid #00ff00; z-index: 50; display: none; flex-direction: column; padding: 10px; }
        .feed-panel.open { display: flex; }
        .feed-item { background: #1a1a1a; padding: 5px; margin-bottom: 5px; border-left: 4px solid #555; font-size: 12px; color: #ccc; }
        
        /* Цвета в ленте */
        .feed-item.clean { border-color: lime; }
        .feed-item.suspicious { border-color: yellow; }
        .feed-item.dangerous { border-color: orange; }
        .feed-item.critical { border-color: red; }

    </style>
</head>
<body>

    <!-- LOGIN -->
    <div id="auth-screen">
        <div class="auth-box">
            <h2 style="margin:0 0 20px 0; color:#00ff00;">SYSTEM LOGIN</h2>
            <input type="email" id="email" class="auth-input" placeholder="Email">
            <input type="password" id="password" class="auth-input" placeholder="Password">
            <button class="auth-btn" id="btnLogin">CONNECT</button>
            <button class="auth-btn" style="background:#222;" id="btnRegister">REGISTER</button>
            <div id="auth-error" style="color:red; margin-top:10px; display:none;">Error</div>
        </div>
    </div>

    <!-- APP -->
    <div id="app-screen">
        <div class="top-menu">
            <span id="user-display" style="color:#444; margin-right:10px;">...</span>
            <button class="menu-btn" onclick="toggleFeed()">FEED</button>
            <button class="menu-btn" onclick="doLogout()">EXIT</button>
        </div>

        <h1>🧬 VIRUS HUNTER v13.0</h1>

        <div class="control-bar">
            <select id="targetType" title="Target Type">
                <option value="bat">Batch (.bat)</option>
                <option value="py">Python (.py)</option>
                <option value="exe">Binary (.exe)</option>
                <option value="jar">Java (.jar)</option>
                <option value="vbs">VBScript (.vbs)</option>
                <option value="ps1">PowerShell (.ps1)</option>
                <option value="web">Web (.html/.js)</option>
                <option value="zip">Archive (.zip)</option>
            </select>
            <input type="file" id="fileInput">
            <select id="scanMode" title="Scan Mode">
                <option value="fast">Fast Scan</option>
                <option value="auto" disabled>Auto (Smart) [LOCK]</option>
                <option value="full" disabled>Full (Deep) [LOCK]</option>
            </select>
            <button id="btnScan" disabled onclick="startScanLogic()">ЗАПУСК</button>
        </div>

        <div class="status-bar">
            <span id="status-text">System ready. Select file.</span>
            <span id="sub-badge" style="color:#888;">SUBSCRIPTION: LOADING...</span>
        </div>

        <div class="terminal" id="terminal">
            <div class="sys">> Initializing logic engine v13.0... OK</div>
            <div class="sys">> Database connection... OK</div>
        </div>

        <div class="feed-panel" id="feedPanel">
            <div style="color:orange; margin-bottom:10px; font-weight:bold;">GLOBAL THREATS</div>
            <div id="feed" style="overflow-y:auto; flex:1;">Loading...</div>
            <button onclick="toggleFeed()" style="margin-top:10px; background:#333; color:#fff; border:none; padding:5px; cursor:pointer;">CLOSE</button>
        </div>
    </div>

    <!-- VERDICT -->
    <div id="verdict" class="verdict-modal">
        <div class="v-title-text">ANALYSIS REPORT</div>
        <div id="v-score" class="v-score">CLEAN</div>
        <div id="v-desc">No malicious patterns detected.</div>
        <div id="v-details" class="v-details-box">
            <div style="color:#888; margin-bottom:5px; border-bottom:1px solid #333;">FOUND OBJECTS:</div>
            <ul id="v-list" class="v-details-list"></ul>
        </div>
        <button class="btn-close" onclick="document.getElementById('verdict').style.display='none'">CLOSE</button>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/9.22.0/firebase-app.js";
        import { getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/9.22.0/firebase-auth.js";
        import { getDatabase, ref, set, push, onValue } from "https://www.gstatic.com/firebasejs/9.22.0/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDYQgJa7rlB_CAB4ywufavumzZrsS_pqNc",
            authDomain: "antivirus-1f569.firebaseapp.com",
            databaseURL: "https://antivirus-1f569-default-rtdb.firebaseio.com",
            projectId: "antivirus-1f569",
            storageBucket: "antivirus-1f569.firebasestorage.app",
            messagingSenderId: "780704862578",
            appId: "1:780704862578:web:a3f4eafe292a00ace8cdeb"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getDatabase(app);

        let fileRawData = null;
        let fileName = "";

        window.toggleFeed = () => document.getElementById('feedPanel').classList.toggle('open');
        window.doLogout = () => signOut(auth);

        // AUTH LOGIC
        onAuthStateChanged(auth, (user) => {
            if(user) {
                document.getElementById('auth-screen').style.display = 'none';
                document.getElementById('app-screen').style.display = 'flex';
                document.getElementById('user-display').innerText = user.email;
                loadUser(user.uid);
                listenFeed();
            } else {
                document.getElementById('auth-screen').style.display = 'flex';
                document.getElementById('app-screen').style.display = 'none';
            }
        });

        function loadUser(uid) {
            onValue(ref(db, 'Users/'+uid), (s) => {
                const d = s.val();
                const sub = (d && d.Subscribe) ? d.Subscribe : 'default';
                document.getElementById('sub-badge').innerText = `SUBSCRIPTION: ${sub.toUpperCase()}`;
                const oA = document.querySelector('option[value="auto"]');
                const oF = document.querySelector('option[value="full"]');
                oA.disabled=true; oA.innerText="Auto [LOCK]";
                oF.disabled=true; oF.innerText="Full [LOCK]";
                if(sub === 'Auto' || sub === 'Full') { oA.disabled=false; oA.innerText="Auto (Smart)"; }
                if(sub === 'Full') { oF.disabled=false; oF.innerText="Full (Deep + Decrypt)"; }
            });
        }

        document.getElementById('btnLogin').onclick = () => {
            signInWithEmailAndPassword(auth, document.getElementById('email').value, document.getElementById('password').value)
            .catch(e => { document.getElementById('auth-error').innerText = "Login Failed"; document.getElementById('auth-error').style.display='block'; });
        };
        document.getElementById('btnRegister').onclick = () => {
            const e = document.getElementById('email').value, p = document.getElementById('password').value;
            if(p.length<6) return alert("Password min 6 chars");
            createUserWithEmailAndPassword(auth, e, p)
            .then(c => set(ref(db, 'Users/'+c.user.uid), {email:e, Subscribe:"default"}))
            .catch(e => alert(e.message));
        };

        // --- RULES (LEVELS: 1=SUSPICIOUS, 2=DANGEROUS, 3=VERY DANGEROUS) ---

        const batRules = [
            { regex: /del\s|erase\s/i, msg: "DELETE FILE", level: 1 },
            { regex: /ren\s|rename\s/i, msg: "RENAME FILE", level: 1 },
            { regex: /move\s/i, msg: "MOVE FILE", level: 1 },
            { regex: /shutdown/i, msg: "SHUTDOWN/REBOOT", level: 1 },
            
            { regex: /copy\s|xcopy\s/i, msg: "COPY FILE", level: 2 },
            { regex: /attrib\s/i, msg: "HIDE FILES", level: 2 },
            { regex: /%0/i, msg: "FORK BOMB / LOOP", level: 2 },
            { regex: /CurrentVersion\\Run/i, msg: "REGISTRY AUTORUN", level: 2 },

            { regex: /format\s/i, msg: "FORMAT DISK", level: 3 },
            { regex: /reg\s+add|reg\s+delete/i, msg: "REGISTRY MODIFICATION", level: 3 },
            { regex: /rd\s|rmdir\s/i, msg: "DELETE FOLDER", level: 2 }
        ];
        
        const pyRules = [
            { regex: /os\.remove|shutil\.rmtree/i, msg: "PY: DELETE FILE", level: 1 },
            { regex: /os\.rename/i, msg: "PY: RENAME FILE", level: 1 },
            
            { regex: /shutil\.copy/i, msg: "PY: COPY FILE", level: 2 },
            { regex: /w\.attributes\("-fullscreen",\s*True\)/i, msg: "WINLOCKER: FULLSCREEN", level: 2 },
            
            { regex: /ctypes\.windll|BlockInput/i, msg: "WINLOCKER: BLOCK INPUT", level: 3 },
            { regex: /pynput|keyboard\.hook/i, msg: "SPYWARE: KEYLOGGER", level: 3 },
            { regex: /winreg/i, msg: "PY: REGISTRY HACK", level: 3 }
        ];

        const exeRules = [
            { regex: /ShellExecute/i, msg: "API: EXECUTE COMMAND", level: 1 },
            { regex: /IsDebuggerPresent/i, msg: "ANTI-DEBUG", level: 1 },
            
            { regex: /InternetOpen|URLDownloadToFile/i, msg: "API: DOWNLOADER", level: 2 },
            { regex: /cmd\.exe|powershell\.exe/i, msg: "STR: SHELL CALL", level: 2 },
            
            { regex: /RegSetValueEx/i, msg: "API: REGISTRY WRITE", level: 3 },
            { regex: /GetAsyncKeyState|SetWindowsHookEx/i, msg: "API: KEYLOGGER HOOK", level: 3 }
        ];

        const vbsRules = [
            { regex: /CreateObject\("WScript\.Shell"\)/i, msg: "VBS: SHELL OBJECT", level: 1 },
            { regex: /FileSystemObject/i, msg: "VBS: FILE SYSTEM", level: 1 },
            { regex: /AutoOpen|Document_Open/i, msg: "VBS: MACRO VIRUS", level: 2 }
        ];

        // Helper: Проверка на системные файлы (повышает уровень до 3)
        function checkSystemTargets(line) {
            if (line.toLowerCase().includes("windows") || line.toLowerCase().includes("system32")) {
                return true;
            }
            return false;
        }

        document.getElementById('fileInput').onchange = (e) => {
            const f = e.target.files[0];
            if(f) {
                fileName = f.name;
                fileRawData = f;
                const type = document.getElementById('targetType').value;
                const reader = new FileReader();
                reader.onload = (ev) => {
                    fileLines = ev.target.result.split('\n');
                    document.getElementById('btnScan').disabled = false;
                    log(`Loaded: ${fileName} (${(f.size/1024).toFixed(1)} KB)`);
                    document.getElementById('status-text').innerText = `Ready.`;
                };
                if(type==='exe'||type==='jar'||fileName.endsWith('.exe')) reader.readAsText(f, 'ISO-8859-1');
                else reader.readAsText(f, 'CP866');
            }
        };

        function log(t, c="") {
            const term = document.getElementById('terminal');
            term.innerHTML += `<div class="log-line ${c}">> ${t}</div>`;
            term.scrollTop = term.scrollHeight;
        }

        window.startScanLogic = async () => {
            const mode = document.getElementById('scanMode').value;
            const type = document.getElementById('targetType').value;
            
            document.getElementById('btnScan').disabled = true;
            document.getElementById('terminal').innerHTML = "";
            document.getElementById('verdict').style.display = "none";
            
            log(`SCAN STARTED. MODE: ${mode.toUpperCase()}`);

            // Logic for ZIP omitted for brevity in this specific prompt to fit logic update, 
            // but you can paste previous ZIP logic here if needed. 
            // Focusing on standard file scan loop.

            let delay = mode==='full'?10:2;
            let acc = mode==='fast'?0.5:(mode==='auto'?0.8:1.0);
            let idx = 0;
            
            // MAIN METRIC: HIGHEST DETECTED THREAT LEVEL
            let maxThreatLevel = 0; 
            let foundThreats = [];

            // Select rules
            let rules = batRules;
            if(type === 'py') rules = pyRules;
            if(type === 'exe') rules = exeRules;
            if(type === 'vbs') rules = vbsRules;

            function step() {
                if(idx >= fileLines.length) { finish(maxThreatLevel, mode, foundThreats); return; }
                let line = fileLines[idx].trim();
                
                // Decrypt
                if(mode==='full' && (type==='bat'||type==='vbs') && line.includes('^')) {
                    line = line.replaceAll('^', '');
                    if(Math.random()>0.9) log("Decrypting...", "decrypt");
                }

                if(line.length > 3 && !line.startsWith('rem') && !line.startsWith('#')) {
                    for(const r of rules) {
                        if(r.regex.test(line) && Math.random()<=acc) {
                            let currentLevel = r.level;
                            
                            // Check for SYSTEM file deletion override
                            if (checkSystemTargets(line) && (r.msg.includes("DELETE") || r.msg.includes("FORMAT"))) {
                                currentLevel = 3; // Automatic VERY DANGEROUS
                                r.msg += " (SYSTEM FILE!)";
                            }

                            // Update max threat
                            if(currentLevel > maxThreatLevel) maxThreatLevel = currentLevel;
                            
                            foundThreats.push({ msg: r.msg, level: currentLevel });
                            log(`DETECTED: ${r.msg}`, `level-${currentLevel}`);
                            break; 
                        }
                    }
                }
                idx++;
                setTimeout(step, delay);
            }
            step();
        };

        function finish(maxLevel, mode, threats) {
            document.getElementById('btnScan').disabled = false;
            
            let status = "CLEAN";
            let color = "lime";

            if(maxLevel === 1) { status = "SUSPICIOUS"; color = "yellow"; }
            if(maxLevel === 2) { status = "DANGEROUS"; color = "orange"; }
            if(maxLevel === 3) { status = "VERY DANGEROUS"; color = "red"; }

            log(`RESULT: ${status}`, maxLevel > 0 ? `level-${maxLevel}` : "sys");
            
            const v = document.getElementById('verdict');
            const vs = document.getElementById('v-score');
            const vd = document.getElementById('v-desc');
            const vList = document.getElementById('v-list');
            const vBox = document.getElementById('v-details');
            
            v.style.display = "block";
            v.style.borderColor = color;
            vs.innerText = status;
            vs.style.color = color;
            
            vList.innerHTML = "";
            if(maxLevel === 0) {
                vd.innerText = "System safe. No threats found.";
                vBox.style.display = "none";
            } else {
                vd.innerText = "Malicious patterns detected.";
                vBox.style.display = "block";
                // Remove duplicates for cleaner list
                const unique = [...new Set(threats.map(t => JSON.stringify(t)))].map(s => JSON.parse(s));
                
                unique.forEach(t => {
                    let li = document.createElement("li");
                    li.innerText = `[L${t.level}] ${t.msg}`;
                    if(t.level === 1) li.style.color = "yellow";
                    if(t.level === 2) li.style.color = "orange";
                    if(t.level === 3) li.style.color = "red";
                    vList.appendChild(li);
                });
            }

            push(ref(db, 'scans'), {
                filename: fileName, score: maxLevel, status: status, mode: mode,
                user: document.getElementById('user-display').innerText, timestamp: Date.now()
            });
        }

        function listenFeed() {
            onValue(ref(db, 'scans'), (s) => {
                const f = document.getElementById('feed');
                f.innerHTML = "";
                const d = s.val();
                if(!d) return;
                Object.values(d).reverse().slice(0,15).forEach(i => {
                    let c = "clean";
                    if(i.score === 1) c = "suspicious";
                    if(i.score === 2) c = "dangerous";
                    if(i.score === 3) c = "critical";
                    f.innerHTML += `<div class="feed-item ${c}"><b>${i.filename}</b><br>${i.status}</div>`;
                });
            });
        }
    </script>
</body>
</html>
